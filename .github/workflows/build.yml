name: Build BLACK EDITION APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Check submodules
        run: |
          pwd
          git submodule status --recursive
          ls -la
          ls -la NoBlocklist || true

      - name: Download NoBlocklist
        run: git clone https://github.com/MojoLauncher/NoBlocklist.git NoBlocklist

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Gradle memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

      - name: Build APK
        run: ./gradlew :Hyper_Launcher_v3:assembleDebug

      - name: Rename APK
        run: |
          APK=$(find Hyper_Launcher_v3/build/outputs/apk -type f -iname '*arm64*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ARM64 APK not found!"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/BLACK-EDITION-JAVA-ARM64.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-EDITION-ARM64
          path: dist/BLACK-EDITION-JAVA-ARM64.apk
