name: Build BLACK EDITION APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Check submodules
        run: |
          pwd
          git submodule status --recursive
          ls -la
          ls -la NoBlocklist || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :Hyper_Launcher_v3:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-EDITION-APK
          path: Hyper_Launcher_v3/build/outputs/apk/debug/*.apk
